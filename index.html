<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이릴 퀘스트</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #2c2c2c;
            border: 2px solid #555;
            border-radius: 12px;
            padding: 30px;
            width: 450px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #a8e6cf;
            margin-bottom: 10px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        input[type="text"] {
            padding: 10px;
            width: 80%;
            border-radius: 5px;
            border: 1px solid #777;
            background-color: #3c3c3c;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            background-color: #3b7a57;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #50c878;
        }
        .choice-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            background-color: #444;
            text-align: left;
        }
        .choice-btn:hover {
            background-color: #666;
        }
        .plant-visual {
            font-size: 80px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dialogue {
            font-style: italic;
            color: #ffd3b6;
            min-height: 40px;
            margin-bottom: 15px;
        }
        .popup {
            background: rgba(0,0,0,0.8);
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background: #333;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #777;
        }
    </style>
</head>
<body>

    <!-- 시작 팝업 -->
    <div id="popup-screen" class="popup">
        <div class="popup-content">
            <h2>메이릴 퀘스트</h2>
            <p>이 게임은 5분이 소요됩니다.</p>
            <button onclick="closePopup()">게임 시작</button>
        </div>
    </div>

    <div class="game-container">
        <!-- 이름 입력 화면 -->
        <div id="name-screen" class="screen">
            <h1>메이릴의 온실</h1>
            <p>씨앗을 멋지게 성장시켜 봅시다.</p>
            <p>씨앗의 이름을 정해주세요:</p>
            <input type="text" id="plant-name" placeholder="씨앗의 이름 입력">
            <br>
            <button onclick="startGame()">키우기 시작</button>
        </div>

        <!-- 게임 진행 화면 -->
        <div id="play-screen" class="screen">
            <h2 id="display-name">식물 이름</h2>
            <div class="plant-visual" id="plant-emoji">🌱</div>
            <div class="dialogue" id="dialogue-box">씨앗이 조용히 숨을 쉽니다...</div>
            <div id="question-container">
                <p id="question-text">질문 대기 중...</p>
                <div id="choices"></div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="screen">
            <h1>성장 결과</h1>
            <div class="plant-visual" id="final-emoji">🌿</div>
            <h2 id="final-title">결과 타이틀</h2>
            <p id="final-desc">설명</p>
            <div style="font-size: 14px; color: #aaa; margin-top: 15px;">
                [최종 수치]<br>
                사악함: <span id="stat-evil">0</span> | 순수함: <span id="stat-pure">0</span> | 괴짜: <span id="stat-weird">0</span>
            </div>
            <br>
            <button onclick="location.reload()">다시 하기</button>
        </div>
    </div>

<script>
    let plantName = "";
    let currentStep = 0;
    let stats = { evil: 0, pure: 0, weird: 0 };
    let dialogueTimer = null;

    const stages = [
        // 1번 선택지
        {
            question: "물을 줘야 할 것 같다. 어떤 것을 주시겠습니까?",
            choices: [
                { text: "악으로 깡으로 버텨라.", type: "evil" },
                { text: "물", type: "pure" },
                { text: "마라탕", type: "weird" }
            ]
        },
        // 2번 선택지
        {
            question: "햇빛을 쬐어줘야 할 것 같다. 햇빛을 쬐어주시겠습니까?",
            choices: [
                { text: "어둠의 자식은 햇빛 따위 쬐지 않는다.", type: "evil" },
                { text: "햇빛을 쬐어준다.", type: "pure" },
                { text: "내가 바로 햇빛이다.", type: "weird" }
            ]
        },
        // 3번 선택지
        {
            question: "식물과 교감을 시도해보자.",
            choices: [
                { text: "식물에게 교감은 사치다.", type: "evil" },
                { text: "노래를 불러준다.", type: "pure" },
                { text: "함께 춤춘다.", type: "weird" }
            ]
        },
        // 4번 선택지
        {
            question: "과연 어떤 모습으로 성장할지 상상해 보자.",
            choices: [
                { text: "온세상을 뒤흔들 어둠의 지배자", type: "evil" },
                { text: "어떤 모습이든 상관없다.", type: "pure" },
                { text: "나를 닮은 모습", type: "weird" }
            ]
        },
        // 5번 선택지
        {
            question: "곧 성장할 것 같다! 응원해주자!",
            choices: [
                { text: "와라.", type: "evil" },
                { text: "힘 내!", type: "pure" },
                { text: "깨어나세요 용사여.", type: "weird" }
            ]
        }
    ];

    const dialogues = [
        "꼼지락거리고 있다...",
        "간지러운지 잎을 파르르 떨었다.",
        "이상한 눈빛으로 당신을 쳐다본다.",
        "혼자서 작게 중얼거리는 것 같다.",
        "쑥쑥 자랄 준비를 하는가 보다."
    ];

    function closePopup() {
        document.getElementById('popup-screen').style.display = 'none';
        document.getElementById('name-screen').classList.add('active');
    }

    function startGame() {
        const input = document.getElementById('plant-name').value.trim();
        if (!input) {
            alert('씨앗의 이름을 입력해주세요!');
            return;
        }
        plantName = input;
        document.getElementById('display-name').innerText = plantName;
        
        document.getElementById('name-screen').classList.remove('active');
        document.getElementById('play-screen').classList.add('active');

        runGameFlow();
    }

    function runGameFlow() {
        if (currentStep < stages.length) {
            // 질문 전 혼잣말 2번 실행 (각 간격 20초 총 40초, 전체 5분 템포에 맞춤)
            triggerDialogue(() => {
                triggerDialogue(() => {
                    showQuestion();
                });
            });
        } else {
            showResult();
        }
    }

    function triggerDialogue(callback) {
        let count = 0;
        document.getElementById('question-text').style.display = 'none';
        document.getElementById('choices').style.display = 'none';

        dialogueTimer = setInterval(() => {
            const randomMsg = dialogues[Math.floor(Math.random() * dialogues.length)];
            document.getElementById('dialogue-box').innerText = `"${plantName}": ${randomMsg}`;
            count++;
            if (count >= 2) {
                clearInterval(dialogueTimer);
                callback();
            }
        }, 15000); // 15초마다 혼잣말 (5분 플레이 타임 고려)
        
        // 첫 시작 즉시 첫 혼잣말 출력
        const randomMsg = dialogues[Math.floor(Math.random() * dialogues.length)];
        document.getElementById('dialogue-box').innerText = `"${plantName}": ${randomMsg}`;
    }

    function showQuestion() {
        document.getElementById('dialogue-box').innerText = "선택의 순간이 찾아왔습니다!";
        document.getElementById('question-text').style.display = 'block';
        document.getElementById('choices').style.display = 'block';

        let stage = stages[currentStep];
        document.getElementById('question-text').innerText = stage.question;
        
        let choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = "";

        stage.choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = () => selectChoice(choice.type);
            choicesDiv.appendChild(btn);
        });
    }

    function selectChoice(type) {
        stats[type]++;
        currentStep++;
        
        // 성장 단계에 따른 이모지 변화 연출
        let emojis = ['🌿', '🪴', '🌳', '🌺', '✨'];
        document.getElementById('plant-emoji').innerText = emojis[currentStep - 1] || '🌱';

        runGameFlow();
    }

    function showResult() {
        document.getElementById('play-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');

        document.getElementById('stat-evil').innerText = stats.evil;
        document.getElementById('stat-pure').innerText = stats.pure;
        document.getElementById('stat-weird').innerText = stats.weird;

        let finalTitle = "";
        let finalDesc = "";
        let finalEmoji = "";

        // 가장 높은 수치 판별 (동률일 경우 사악함 > 순수함 > 괴짜 순 우선순위)
        if (stats.evil >= stats.pure && stats.evil >= stats.weird) {
            finalTitle = "피도 눈물도 없는 식충식물";
            finalDesc = "가혹한 환경과 매몰찬 관리 속에서 자라나 주변의 모든 것을 집어삼킬 듯한 포스를 뿜어냅니다.(*화면을 캡쳐하여 메이릴에게 보여줍시다.)";
            finalEmoji = "🪴🦷";
        } else if (stats.pure >= stats.evil && stats.pure >= stats.weird) {
            finalTitle = "우유빛깔 천송이의 꽃";
            finalDesc = "따스한 햇살과 정성 어린 사랑 속에서 자라나 온실 안을 환하게 밝히는 아름다운 꽃을 피워냈습니다.(*화면을 캡쳐하여 메이릴에게 보여줍시다.)";
            finalEmoji = "🌸✨";
        } else {
            finalTitle = "춤추는 선인장";
            finalDesc = "엉뚱한 교감의 여파로, 음악만 나오면 정체 모를 댄스를 추는 기괴하고 유쾌한 생명체가 되었습니다.(*화면을 캡쳐하여 메이릴에게 보여줍시다.)";
            finalEmoji = "🌵💃";
        }

        document.getElementById('final-title').innerText = finalTitle;
        document.getElementById('final-desc').innerText = finalDesc;
        document.getElementById('final-emoji').innerText = finalEmoji;
    }
</script>

</body>
</html>
